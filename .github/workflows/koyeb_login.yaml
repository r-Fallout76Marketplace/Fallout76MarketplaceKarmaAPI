name: Koyeb Login

on:
  schedule:
    # Every 5 days at 03:00 UTC, approximately
    - cron: '0 3 */5 * *'
  workflow_dispatch:

jobs:
  koyeb-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Run Koyeb login
        env:
          KOYEB_EMAIL: ${{ secrets.KOYEB_EMAIL }}
          KOYEB_PASSWORD: ${{ secrets.KOYEB_PASSWORD }}
        run: python .github/scripts/koyeb_login.py
